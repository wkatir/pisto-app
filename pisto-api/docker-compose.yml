services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pisto-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - pisto_mssql_data:/var/opt/mssql

volumes:
  pisto_mssql_data:
